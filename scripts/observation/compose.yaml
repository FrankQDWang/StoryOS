services:
  query:
    image: python:3.13.7-alpine
    command: [python, /query.py, --container, --database, /observation/runs.sqlite,
      --collector-health, /observation/collector.json, --health-file, /health/probe.json,
      --grafana-url, "http://grafana:3000"]
    ports: ["127.0.0.1:3754:3754"]
    volumes:
      - ../verification_observation_api.py:/query.py:ro
      - ../verification_observation_health.py:/verification_observation_health.py:ro
      - ../../target/observation/data:/observation:ro
      - ../../target/observation/health:/health
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: none
  collector:
    image: python:3.13.7-alpine
    command: [python, /collector.py, watch, --records, /records, --database, /observation/runs.sqlite]
    volumes:
      - ../verification_observation.py:/collector.py:ro
      - ../verification_observation_cost.py:/verification_observation_cost.py:ro
      - ../verification_observation_nodes.py:/verification_observation_nodes.py:ro
      - ../verification_observation_rules.py:/verification_observation_rules.py:ro
      - ./settings.json:/observation/settings.json:ro
      - ../../target/verification:/records:ro
      - ../../target/observation/data:/observation
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: none
  grafana:
    build: .
    entrypoint: [sh, -c, 'export GF_SECURITY_ADMIN_PASSWORD=$$(head -c 32 /dev/urandom | base64); exec /run.sh']
    ports: ["127.0.0.1:3749:3000"]
    volumes:
      - ../../target/observation/data:/observation:ro
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/dashboards:ro
      - ../../target/observation/plugins/storyos-supervision-app:/var/lib/grafana/plugins/storyos-supervision-app:ro
      - ../../target/observation/grafana:/var/lib/storyos-grafana
    environment:
      GF_PATHS_DATA: /var/lib/storyos-grafana
      GF_PATHS_LOGS: /var/lib/storyos-grafana/logs
      GF_LOG_MODE: file
      GF_LOG_LEVEL: warn
      GF_LOG_FILE_MAX_SIZE_SHIFT: "20"
      GF_LOG_FILE_MAX_DAYS: "2"
      GF_USERS_DEFAULT_THEME: light
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: storyos-supervision-app
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1
    logging:
      driver: none
