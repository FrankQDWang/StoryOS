name: Full repository verification

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: storyos-full-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verify:
    name: full-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch contract evidence commits
        run: |
          git fetch --no-tags --depth=1 origin \
            bab4c0ac5ca3da20b01ea1d61783aaba414f493f \
            615408dabba489805f36aee83719cd0e8eb18dc3 \
            3468bdaaaa97ef05fd7c6e3f61836d20f1f76496

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Run repository verification
        run: make verify
        env:
          GH_TOKEN: ${{ github.token }}
