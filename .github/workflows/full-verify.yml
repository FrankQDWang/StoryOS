name: Full repository verification

on:
  workflow_dispatch:
    inputs:
      review_bundle:
        description: Candidate request and independent reviews for manual-linux as JSON
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: storyos-full-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verify:
    name: full-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch contract verification history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git fetch --no-tags --no-recurse-submodules --depth=1 origin \
            bab4c0ac5ca3da20b01ea1d61783aaba414f493f:refs/storyos/verification/execution-baseline \
            615408dabba489805f36aee83719cd0e8eb18dc3:refs/storyos/verification/delivery-baseline \
            3468bdaaaa97ef05fd7c6e3f61836d20f1f76496:refs/storyos/verification/foundation-merge

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          test "$(pnpm --version)" = "11.21.0"

      - name: Require Google Chrome Stable
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || true)"
          test -n "$chrome_path"
          chrome_version="$($chrome_path --version)"
          case "$chrome_version" in
            "Google Chrome "*) ;;
            *)
              printf 'The browser is not Google Chrome Stable: %s\n' "$chrome_version" >&2
              exit 1
              ;;
          esac
          printf 'Google Chrome Stable: %s\n' "$chrome_version"

      - name: Run repository verification
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          bundle = json.loads(os.environ.pop('STORYOS_REVIEW_BUNDLE'))
          request = bundle['request']
          if request['candidate']['purpose'] != 'manual-linux':
              raise SystemExit('Use a reviewed manual-linux request')
          directory = pathlib.Path('target/verification/manual-linux')
          directory.mkdir(parents=True, exist_ok=True)
          path = directory / 'request.json'
          path.write_text(json.dumps(request))
          for axis in ('standards', 'spec'):
              record = directory / (axis + '.json')
              record.write_text(json.dumps(bundle['reviews'][axis]))
              subprocess.run(['python3', 'scripts/verification_reviews.py', 'import', '--request', str(path), '--record', str(record)], check=True)
          policy = json.loads(pathlib.Path('docs/agents/verification-policy.json').read_text())
          for check in policy['complete']['admission']['targeted']:
              subprocess.run(['make', 'verify-targeted', 'CHECK=' + check], check=True)
          subprocess.run(['python3', 'scripts/verification.py', 'run', '--purpose', 'manual-linux',
                          '--pr', str(request['candidate']['pr']), '--base', request['candidate']['base'],
                          '--executor-context', request['executor_context'], '--review-request', str(path),
                          '--', 'make', 'verify-local-steps'], check=True)
          subprocess.run(['make', 'verify-tracker'], check=True)
          PYTHON
        env:
          GH_TOKEN: ${{ github.token }}
          STORYOS_REVIEW_BUNDLE: ${{ inputs.review_bundle }}
          PYTHONDONTWRITEBYTECODE: "1"
