name: Verify main

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Run repository verification
        run: make verify
        env:
          GH_TOKEN: ${{ github.token }}
