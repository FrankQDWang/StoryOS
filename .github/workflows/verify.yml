name: Verify pull request

# The fast check tier of ADR 0070. The product tests run on the machine of the author in make check.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, cleanup-phase-1]

permissions:
  contents: read

concurrency:
  group: storyos-pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      # The generated-contract check reads the trees of these Stage 1 baseline commits.
      - name: Fetch the contract baseline commits
        run: |
          git fetch --no-tags --no-recurse-submodules --depth=1 origin \
            bab4c0ac5ca3da20b01ea1d61783aaba414f493f:refs/storyos/verification/execution-baseline \
            615408dabba489805f36aee83719cd0e8eb18dc3:refs/storyos/verification/delivery-baseline \
            3468bdaaaa97ef05fd7c6e3f61836d20f1f76496:refs/storyos/verification/foundation-merge

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # The pnpm step comes after this one, so this action cannot find pnpm for its cache.
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          test "$(pnpm --version)" = "11.21.0"

      # The checkout is the merge commit of the pull request, so its first parent is the base.
      - name: Run make check-fast
        run: make check-fast BASE=HEAD^1
