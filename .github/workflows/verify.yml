name: Verify pull request

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  issues: read

concurrency:
  group: storyos-pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the pull request candidate
        run: make verify-pr
        env:
          GH_TOKEN: ${{ github.token }}
          STORYOS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STORYOS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
