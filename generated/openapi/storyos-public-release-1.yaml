openapi: 3.1.0
info:
  title: StoryOS Public Release 1
  version: storyos.public.release.1
  x-storyos-contract-revision: release1-wire-catalog-2026-08-13-editor-session
  x-storyos-implemented-slice: getProtocolProfile,getProject,getChapter,createProjectCommandChallenge,createEditorSession,getEditorSession
paths:
  /api/v1/protocol:
    get:
      operationId: getProtocolProfile
      summary: Discover the active StoryOS Release 1 protocol profile
      responses:
        '200':
          description: Active protocol profile
          content:
            application/json:
              schema:
                $ref: '../json-schema/storyos-public-release-1/protocol-profile-response.schema.json'
        '400':
          description: Invalid request
        '405':
          description: Method not allowed
        '409':
          description: Active release conflict
        '429':
          description: Rate limited
  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      summary: Read one controlled StoryOS Project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current Project
          content:
            application/json:
              schema:
                $ref: '../json-schema/storyos-public-release-1/project-response.schema.json'
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Request origin refused
        '404':
          description: Resource unavailable
        '405':
          description: Method not allowed
        '429':
          description: Rate limited
        '503':
          description: Service unavailable
  /api/v1/projects/{project_id}/chapters/{chapter_id}:
    get:
      operationId: getChapter
      summary: Read the controlled Project current Chapter
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chapter_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current Project
          content:
            application/json:
              schema:
                $ref: '../json-schema/storyos-public-release-1/chapter-response.schema.json'
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Request origin refused
        '404':
          description: Resource unavailable
        '405':
          description: Method not allowed
        '429':
          description: Rate limited
        '503':
          description: Service unavailable
  /api/v1/projects/{project_id}/editor-sessions/{editor_session_id}:
    get:
      operationId: getEditorSession
      summary: Read one exact Editor Session
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: editor_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Editor Session
          content:
            application/json:
              schema:
                $ref: '../json-schema/storyos-public-release-1/editor-session-get-response.schema.json'
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Request origin refused
        '404':
          description: Resource unavailable
        '405':
          description: Method not allowed
        '409':
          description: Session binding conflict
        '413':
          description: Request too large
        '415':
          description: Unsupported content type
        '422':
          description: Request refused
        '429':
          description: Rate limited
        '503':
          description: Service unavailable
  /api/v1/projects/{project_id}/anti-forgery-challenges:
    post:
      operationId: createProjectCommandChallenge
      summary: Issue one exact Project command challenge
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../json-schema/storyos-public-release-1/project-command-challenge-request.schema.json'
      responses:
        '200':
          description: Project command challenge
          content:
            application/json:
              schema:
                $ref: '../json-schema/storyos-public-release-1/project-command-challenge-response.schema.json'
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Request origin refused
        '404':
          description: Resource unavailable
        '405':
          description: Method not allowed
        '409':
          description: Idempotency binding conflict
        '413':
          description: Request too large
        '415':
          description: Unsupported content type
        '422':
          description: Command target refused
        '428':
          description: Precondition required
        '429':
          description: Rate limited
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 60
        '503':
          description: Service unavailable
  /api/v1/projects/{project_id}/editor-sessions:
    post:
      operationId: createEditorSession
      summary: Create one Editor Session
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-StoryOS-Anti-Forgery
          in: header
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../json-schema/storyos-public-release-1/editor-session-create-request.schema.json'
      responses:
        '200':
          description: Current Editor Session
          content:
            application/json:
              schema:
                $ref: '../json-schema/storyos-public-release-1/editor-session-create-response.schema.json'
        '201':
          description: Created Editor Session
          content:
            application/json:
              schema:
                $ref: '../json-schema/storyos-public-release-1/editor-session-create-response.schema.json'
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Request origin refused
        '404':
          description: Resource unavailable
        '405':
          description: Method not allowed
        '409':
          description: Idempotency binding conflict
        '412':
          description: Session binding refused
        '413':
          description: Request too large
        '415':
          description: Unsupported content type
        '422':
          description: Request refused
        '428':
          description: Precondition required
        '429':
          description: Rate limited
        '503':
          description: Service unavailable
components: {}
