[workspace]
members = ["crates/storyos-contracts", "crates/storyos-server"]
resolver = "3"
[workspace.package]
edition = "2024"
rust-version = "1.96"
[workspace.dependencies]
axum = "=0.8.9"
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread"] }
ts-rs = "=12.0.1"
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "deny"
