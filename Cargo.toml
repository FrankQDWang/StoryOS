[workspace]
members = [
  "crates/storyos-adapter-diagnostics",
  "crates/storyos-adapter-fake-destination",
  "crates/storyos-adapter-postgres",
  "crates/storyos-adapter-volcengine-responses",
  "crates/storyos-application",
  "crates/storyos-contracts",
  "crates/storyos-core",
  "crates/storyos-literal-guard",
  "crates/storyos-server",
  "crates/storyos-worker",
  "crates/storyos-worker-bin",
]
resolver = "3"
[workspace.package]
edition = "2024"
rust-version = "1.98"
[workspace.dependencies]
axum = "=0.8.9"
hmac = "=0.13.0"
jsonschema = { version = "=0.50.1", default-features = false }
mime = "=0.3.17"
# The repository tool crate storyos-literal-guard alone uses proc-macro2 and syn.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
syn = { version = "=2.0.119", features = ["full", "visit"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tokio-postgres = "=0.7.15"
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
# ADR 0047: JSON lines only, with no ANSI output and no `log` bridge.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
# Serde owns strict wire decoding; generated TypeScript shape is verified separately.
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
url = "=2.5.8"
uuid = { version = "=1.18.1", features = ["v7"] }
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "deny"
uninlined_format_args = "deny"
redundant_closure_for_method_calls = "deny"
collapsible_else_if = "deny"
