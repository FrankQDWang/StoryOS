[workspace]
members = ["crates/storyos-contracts"]
resolver = "3"
[workspace.package]
edition = "2024"
rust-version = "1.96"
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "deny"
